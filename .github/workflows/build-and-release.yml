name: Build All Platforms

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: archive-builder-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-runtime.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Verify release metadata
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: python scripts/verify_release.py --tag "$RELEASE_TAG"
      - name: Verify selected Python runtime
        run: python -c "import tkinter, httpx, bs4, dateutil, openpyxl; tkinter.Tcl(); print('Runtime ready')"
      - name: Compile source
        run: python -m compileall -q archive_builder tests scripts run_app.py run_cli.py
      - name: Run tests
        run: python -m pytest -q

  windows:
    name: Build Windows x64
    needs: test
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          architecture: "x64"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install build tools
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-build.txt
      - name: Verify runtime imports
        run: python -c "import tkinter, httpx, bs4, dateutil, openpyxl; tkinter.Tcl(); print('Windows runtime ready')"
      - name: Build Windows package
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - name: Verify Windows CLI
        shell: pwsh
        run: |
          .\dist\ArchiveBuilderCLI\ArchiveBuilderCLI.exe --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Windows CLI help failed" }
          .\dist\ArchiveBuilderCLI\ArchiveBuilderCLI.exe --version
          if ($LASTEXITCODE -ne 0) { throw "Windows CLI version check failed" }
      - name: Verify release files
        shell: pwsh
        run: |
          if (-not (Test-Path "release/ArchiveBuilder-Windows-x64.zip")) { throw "Missing Windows ZIP" }
          if (-not (Test-Path "release/ArchiveBuilder-Windows-x64.zip.sha256")) { throw "Missing Windows checksum" }
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: ArchiveBuilder-Windows-x64
          path: |
            release/ArchiveBuilder-Windows-x64.zip
            release/ArchiveBuilder-Windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Build Linux x64
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install build tools
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-build.txt
      - name: Verify runtime imports
        run: python -c "import tkinter, httpx, bs4, dateutil, openpyxl; tkinter.Tcl(); print('Linux runtime ready')"
      - name: Build Linux package
        run: bash scripts/build_linux.sh
      - name: Verify Linux CLI
        run: |
          ./dist/ArchiveBuilderCLI/ArchiveBuilderCLI --help >/dev/null
          ./dist/ArchiveBuilderCLI/ArchiveBuilderCLI --version
      - name: Verify Linux GUI startup
        run: ARCHIVE_BUILDER_STARTUP_PROBE=1 xvfb-run -a ./dist/ArchiveBuilder/ArchiveBuilder
      - name: Verify release files
        run: |
          test -f release/ArchiveBuilder-Linux-x64.tar.gz
          test -f release/ArchiveBuilder-Linux-x64.tar.gz.sha256
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: ArchiveBuilder-Linux-x64
          path: |
            release/ArchiveBuilder-Linux-x64.tar.gz
            release/ArchiveBuilder-Linux-x64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  macos:
    name: Build macOS Universal
    needs: test
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install build tools
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-build.txt
      - name: Verify Universal2 Python and runtime imports
        run: |
          python -c "import tkinter, httpx, bs4, dateutil, openpyxl; tkinter.Tcl(); print('macOS runtime ready')"
          PYTHON_BINARY="$(python -c 'import sys; print(sys.executable)')"
          lipo -archs "$PYTHON_BINARY"
      - name: Build universal macOS package
        run: bash scripts/build_macos.sh
      - name: Verify release files
        run: |
          test -f release/ArchiveBuilder-macOS-Universal.zip
          test -f release/ArchiveBuilder-macOS-Universal.zip.sha256
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: ArchiveBuilder-macOS-Universal
          path: |
            release/ArchiveBuilder-macOS-Universal.zip
            release/ArchiveBuilder-macOS-Universal.zip.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish Release Assets
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, linux, macos]
    runs-on: ubuntu-22.04
    steps:
      - name: Check out release notes
        uses: actions/checkout@v7
      - name: Download platform artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      - name: Verify release assets
        run: |
          set -euo pipefail
          for file in \
            ArchiveBuilder-Windows-x64.zip \
            ArchiveBuilder-Windows-x64.zip.sha256 \
            ArchiveBuilder-Linux-x64.tar.gz \
            ArchiveBuilder-Linux-x64.tar.gz.sha256 \
            ArchiveBuilder-macOS-Universal.zip \
            ArchiveBuilder-macOS-Universal.zip.sha256; do
            test -f "release-assets/$file" || { echo "Missing release asset: $file"; exit 1; }
          done
          ( cd release-assets && sha256sum --check *.sha256 )
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Archive Builder $TAG" --notes-file RELEASE_NOTES.md
          fi
          gh release upload "$TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
