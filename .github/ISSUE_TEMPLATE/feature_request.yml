name: Feature request
description: Suggest an Archive Builder improvement
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should Archive Builder be able to do?
    validations:
      required: true
  - type: textarea
    id: usecase
    attributes:
      label: Use case
      description: Which archived site or workflow would this help?
